name: MemorySanitizer Analysis

on:
  push:
    branches: [ master, Matrix, Nexus ]
    paths:
      - '**.cpp'
      - '**.h'
      - '**.c'
      - 'src/**'
      - 'lib/**'
  pull_request:
    branches: [ master, Matrix, Nexus ]
    paths:
      - '**.cpp'
      - '**.h'
      - '**.c'
      - 'src/**'
      - 'lib/**'

jobs:
  address-sanitizer:
    name: AddressSanitizer
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install clang with sanitizers
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-14 lld-14 cmake make libgl1-mesa-dev

    - name: Cache sanitizer builds
      uses: actions/cache@v3
      with:
        path: build/
        key: ${{ runner.os }}-asan-${{ hashFiles('src/**', 'lib/**', 'CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-asan-

    - name: Build with AddressSanitizer
      run: |
        mkdir -p build
        cd build
        CC=clang-14 CXX=clang++-14 cmake \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer -O1" \
          -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer -O1" \
          ..
        make -j$(nproc)

    - name: Run with AddressSanitizer
      run: |
        cd build
        # Run the addon with ASAN
        # Note: This may need adjustment based on how the addon is executed
        ASAN_OPTIONS=detect_leaks=1 ./visualization.matrix 2>&1 || true

  undefined-behavior-sanitizer:
    name: UndefinedBehaviorSanitizer
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install clang with sanitizers
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-14 lld-14 cmake make libgl1-mesa-dev

    - name: Cache sanitizer builds
      uses: actions/cache@v3
      with:
        path: build/
        key: ${{ runner.os }}-ubsan-${{ hashFiles('src/**', 'lib/**', 'CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-ubsan-

    - name: Build with UndefinedBehaviorSanitizer
      run: |
        mkdir -p build
        cd build
        CC=clang-14 CXX=clang++-14 cmake \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_CXX_FLAGS="-fsanitize=undefined -O1" \
          -DCMAKE_C_FLAGS="-fsanitize=undefined -O1" \
          ..
        make -j$(nproc)

    - name: Run with UndefinedBehaviorSanitizer
      run: |
        cd build
        UBSAN_OPTIONS=print_stacktrace=1 ./visualization.matrix 2>&1 || true
